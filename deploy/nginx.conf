server {
    listen 80;
    server_name 208.122.29.50;

    # Frontend: built React app (npm run build -> dist/)
    root /var/www/kvh-gpstracker/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API -> Django (Gunicorn) running on 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin, DRF browsable API, etc.)
    location /static/ {
        alias /var/www/kvh-gpstracker/backend/staticfiles/;
    }
}
